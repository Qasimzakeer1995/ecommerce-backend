name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check for vulnerabilities
        run: npm audit --audit-level=moderate
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 with Docker Compose (safe)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail

            REPO="https://github.com/${{ github.repository }}.git"
            DEPLOY_DIR="/home/${{ secrets.EC2_USER }}/ecommerce-backend"
            BRANCH="main"

            # Ensure git is installed
            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y git
            fi

            # Clone if missing, otherwise fetch and reset to remote branch
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "Cloning repo into $DEPLOY_DIR"
              rm -rf "$DEPLOY_DIR"
              git clone --depth=1 --branch "$BRANCH" "$REPO" "$DEPLOY_DIR"
            else
              echo "Updating existing repo at $DEPLOY_DIR"
              cd "$DEPLOY_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cd "$DEPLOY_DIR"

            # Ensure .env exists (optional: set secret values in GitHub Secrets and write here)
            if [ ! -f .env ]; then
              cat > .env <<EOF
MONGO_URL=${{ secrets.MONGO_URL || 'mongodb://mongo:27017/e-comm' }}
PORT=${{ secrets.PORT || '5000' }}
BASE_URL=${{ secrets.BASE_URL || 'http://localhost:5000' }}
EOF
              echo ".env created"
            fi

            # Try docker compose (plugin) then fallback to docker-compose
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            # Pull/build and restart
            $DC pull --ignore-pull-failures || true
            $DC down --remove-orphans || true
            $DC up -d --build

            echo "✅ Deployed via $DC"
            $DC ps