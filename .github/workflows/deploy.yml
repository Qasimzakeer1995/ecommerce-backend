name: Deploy Node App to EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build (optional)
        run: |
          if [ -f package.json ] && grep -q "\"build\":" package.json; then
            npm run build
          else
            echo "No build script, skipping build."
          fi

      - name: Copy files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem
          rsync -avz -e "ssh -i key.pem" --exclude=node_modules ./ $EC2_USER@$EC2_HOST:/home/$EC2_USER/nodeapp/

      - name: Run app on EC2 (PM2)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.EC2_USER }}/nodeapp

            # install dependencies
            npm install --production

            # install pm2 if not exists
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            # start or restart the app on port 5000
            PM2_APP_NAME="nodeapp"

            # export PORT=5000 for app
            export PORT=5000

            pm2 startOrReload ecosystem.config.js || pm2 start npm --name "$PM2_APP_NAME" -- start

            pm2 save
