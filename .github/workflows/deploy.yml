name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Optional audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 with Docker Compose
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail

            # --- Inject runner-side values as shell variables so set -u won't fail ---
            REPO="https://github.com/${{ github.repository }}.git"
            DEPLOY_DIR="/home/${{ secrets.EC2_USER }}/ecommerce-backend"
            BRANCH="main"
            PORT="${{ secrets.PORT }}"       # may be empty if not set
            BASE_URL="${{ secrets.BASE_URL }}" # may be empty if not set

            # ensure git on remote
            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y git
            fi

            # ensure docker is installed (if not, install instructions could be added)
            # ensure deploy dir exists
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR" || exit 1

            # clone or reset repo
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              rm -rf "$DEPLOY_DIR" || true
              git clone --depth=1 --branch "$BRANCH" "$REPO" "$DEPLOY_DIR"
            else
              cd "$DEPLOY_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cd "$DEPLOY_DIR"

            # create/overwrite .env using values injected above
            cat > .env <<EOF
PORT=${PORT:-5000}
BASE_URL=${BASE_URL:-http://localhost:5000}
# Note: MongoDB references intentionally removed
EOF
            echo ".env written (MongoDB removed as requested)"

            # select compose command
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            # build and restart
            $DC pull --ignore-pull-failures || true
            $DC down --remove-orphans || true
            $DC up -d --build

            echo "✅ Deployed via $DC"
            $DC ps