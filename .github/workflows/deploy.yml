name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Optional audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 with Docker Compose
        uses: appleboy/ssh-action@master
        env:
          REPO: https://github.com/${{ github.repository }}.git
          DEPLOY_DIR: /home/${{ secrets.EC2_USER }}/ecommerce-backend
          BRANCH: main
          PORT: ${{ secrets.PORT }}
          BASE_URL: ${{ secrets.BASE_URL }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail

            # ensure git
            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y git
            fi

            # clone or reset repo
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              rm -rf "$DEPLOY_DIR"
              git clone --depth=1 --branch "$BRANCH" "$REPO" "$DEPLOY_DIR"
            else
              cd "$DEPLOY_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cd "$DEPLOY_DIR"

            # create .env using step env values (no GitHub expressions inside heredoc)
            if [ ! -f .env ]; then
              cat > .env <<EOF
PORT=${PORT:-5000}
BASE_URL=${BASE_URL:-http://localhost:5000}
# MONGO_URL intentionally left empty unless provided via secrets
MONGO_URL=${MONGO_URL:-}
EOF
              echo ".env created (MONGO_URL left empty if not provided)"
            fi

            # select compose command
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            # build and restart
            $DC pull --ignore-pull-failures || true
            $DC down --remove-orphans || true
            $DC up -d --build

            echo "✅ Deployed via $DC"
            $DC ps