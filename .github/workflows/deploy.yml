name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Optional audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 with Docker Compose
        uses: appleboy/ssh-action@v0.1.6
        env:
          # runner-side variables (all values quoted to avoid YAML parsing issues)
          REPO: "https://github.com/${{ github.repository }}.git"
          DEPLOY_DIR: "/home/${{ secrets.EC2_USER }}/ecommerce-backend"
          BRANCH: "main"
          PORT: "${{ secrets.PORT }}"
          BASE_URL: "${{ secrets.BASE_URL }}"
        with:
          host: "${{ secrets.EC2_HOST }}"
          username: "${{ secrets.EC2_USER }}"
          key: "${{ secrets.EC2_KEY }}"
          script: |
            set -euo pipefail

            # ensure required env vars were injected by the runner
            : "${REPO:?REPO is not set}"
            : "${DEPLOY_DIR:?DEPLOY_DIR is not set}"
            : "${BRANCH:=main}"
            : "${PORT:=5000}"
            : "${BASE_URL:=http://localhost:5000}"

            # ensure git is installed on remote
            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y git
            fi

            # ensure deploy dir exists and change to it
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR" || exit 1

            # clone or reset repo
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              rm -rf "$DEPLOY_DIR" || true
              git clone --depth=1 --branch "$BRANCH" "$REPO" "$DEPLOY_DIR"
            else
              cd "$DEPLOY_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cd "$DEPLOY_DIR"

            # write/overwrite .env (MongoDB removed)
            cat > .env <<EOF
PORT=${PORT}
BASE_URL=${BASE_URL}
# MongoDB removed intentionally
EOF
            echo ".env written"

            # select docker compose command
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            # build and restart containers
            $DC pull --ignore-pull-failures || true
            $DC down --remove-orphans || true
            $DC up -d --build

            echo "✅ Deployed via $DC"
            $DC ps