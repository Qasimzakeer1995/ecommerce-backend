name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Optional audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 with Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail

            REPO="https://github.com/${{ github.repository }}.git"
            DEPLOY_DIR="/home/${{ secrets.EC2_USER }}/ecommerce-backend"
            BRANCH="main"

            # Ensure git is installed
            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y git
            fi

            # Clone if missing, otherwise fetch and reset to remote branch
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              rm -rf "$DEPLOY_DIR"
              git clone --depth=1 --branch "$BRANCH" "$REPO" "$DEPLOY_DIR"
            else
              cd "$DEPLOY_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cd "$DEPLOY_DIR"

            # Ensure .env exists (MONGO_URL intentionally omitted)
            if [ ! -f .env ]; then
              cat > .env <<EOF
PORT=${{ secrets.PORT || '5000' }}
BASE_URL=${{ secrets.BASE_URL || 'http://localhost:5000' }}
EOF
              echo ".env created (no local MONGO_URL)"
            fi

            # Pick compose command (plugin or legacy)
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            # Build and restart services
            $DC pull --ignore-pull-failures || true
            $DC down --remove-orphans || true
            $DC up -d --build

            echo "✅ Deployed via $DC"
            $DC ps