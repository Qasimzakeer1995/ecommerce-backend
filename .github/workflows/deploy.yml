name: Deploy to EC2 via Docker (existing node/ecommerce-backend)

on:
  push:
    branches: [ "main" ]

env:
  APP_NAME: nodeapp
  REMOTE_DIR: /home/${{ secrets.EC2_USER }}/node/ecommerce-backend
  IMAGE_NAME: ecommerce-backend-image

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (for build/test steps)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (CI)
        run: npm ci

      - name: Build (optional)
        run: |
          if [ -f package.json ] && grep -q "\"build\":" package.json; then
            npm run build
          else
            echo "No build script; skipping build."
          fi

      - name: Configure SSH (write key, known_hosts)
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_KEY" | sed 's/\r$//' > key.pem
          chmod 600 key.pem
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -H -p 22 "$EC2_HOST" >> ~/.ssh/known_hosts || true

      - name: Rsync repository into EC2 node/ecommerce-backend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -avz --delete \
            --exclude=node_modules \
            --exclude='.git' \
            -e "ssh -i key.pem -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            ./ ${EC2_USER}@${EC2_HOST}:${REMOTE_DIR}/

      - name: Build & run Docker on EC2 (host:80 -> container:5000)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          timeout: "300s"      # <-- increased timeout (5 minutes)
          debug: true          # <-- enable debug logs for more info
          script: |
            set -ex
            echo "Deploy started on $(date)"
            echo "Going to: ${REMOTE_DIR}"
            cd "${REMOTE_DIR}"

            # show disk and docker info for debugging
            df -h || true
            docker --version || true

            echo "Stopping old container (if any)..."
            docker rm -f ${APP_NAME} || true

            echo "Building new Docker image..."
            docker build -t ${IMAGE_NAME}:latest .

            echo "Running new container (host:80 -> container:5000)..."
            docker run -d \
              --name ${APP_NAME} \
              --restart unless-stopped \
              -p 80:5000 \
              ${IMAGE_NAME}:latest

            echo "Deployment complete."
            docker ps --filter "name=${APP_NAME}" || true
            echo "Health check localhost:80 (curl may not be installed on minimal images)"
            if command -v curl >/dev/null 2>&1; then
              curl -I --max-time 5 http://localhost:80 || true
            fi
            echo "Deploy finished on $(date)"
